[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wbridge"
version = "0.1.0"
description = "General-purpose selection and shortcut bridge with GTK4/GDK on Wayland; CLI+GUI in one package."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["wayland", "gtk4", "clipboard", "primary-selection", "shortcuts", "cli", "ipc"]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Environment :: X11 Applications :: GTK",  # GTK applies though Wayland session is target
  "Topic :: Utilities",
]

# Keep hard dependencies minimal; GTK bindings are provided by the system (python3-gi).
# HTTP actions can use urllib in-core or 'requests' via optional extra.
dependencies = []

[project.optional-dependencies]
http = ["requests>=2.31.0"]

[project.scripts]
wbridge = "wbridge.cli:main"
wbridge-app = "wbridge.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"wbridge.profiles" = ["**/*"]
"wbridge" = ["help/**/*", "assets/**/*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Narrowed to rules the existing code base passes today (pyflakes plus
# syntax/statement checks). Widen step by step together with code cleanups.
select = ["E4", "E7", "E9", "F"]
ignore = [
  "E401",  # multiple-imports-on-one-line
  "E402",  # module-import-not-at-top-of-file (gi.require_version before imports)
  "E701",  # multiple-statements-on-one-line-colon
  "E702",  # multiple-statements-on-one-line-semicolon
  "E731",  # lambda-assignment
  "E741",  # ambiguous-variable-name
  "F401",  # unused-import
  "F841",  # unused-variable
]
